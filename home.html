<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VANNIANWEB</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #06213b 0%,
                    #020a14 45%,
                    #01050b 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .home {
            width: 100%;
            max-width: 850px;

            padding: 40px 25px;
        }

        .badge {

            display: inline-block;

            padding: 10px 20px;

            border-radius: 50px;

            border: 1px solid #087ed1;

            color: #63c4ff;

            background:
                rgba(0,120,255,0.08);

            font-size: 14px;

            margin-bottom: 30px;

            box-shadow:
                0 0 20px
                rgba(0,140,255,0.12);
        }

        .logo {

            font-size:
                clamp(48px, 12vw, 90px);

            font-weight: 800;

            letter-spacing: 8px;

            margin: 0;
        }

        .logo span {

            color: #008cff;

            text-shadow:
                0 0 20px
                rgba(0,140,255,0.8);
        }

        .slogan {

            font-size: 24px;

            color: #d7e5f2;

            margin-top: 20px;
        }

        .description {

            max-width: 650px;

            margin: 25px auto 40px;

            color: #8fa8bd;

            font-size: 17px;

            line-height: 1.8;
        }

        .explore {

            display: inline-block;

            padding: 17px 35px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            font-size: 17px;

            font-weight: bold;

            background:
                linear-gradient(
                    135deg,
                    #0077ff,
                    #00aaff
                );

            box-shadow:
                0 10px 35px
                rgba(0,130,255,0.3);

            transition: 0.3s;
        }

        .explore:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 40px
                rgba(0,150,255,0.5);
        }

        .location {

            margin-top: 35px;

            color: #60798d;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <main class="home">

        <div class="badge">
            🖤 VANNIANWEB • CHÀO ĐÓN ANH EM
        </div>


        <h1 class="logo">
            VANNIAN<span>.</span>
        </h1>


        <div class="slogan">
            Uy Tín Tạo Niềm Tin ❤️
        </div>


        <p class="description">

            Điểm tựa công nghệ dành cho anh em
            yêu game, công nghệ và những trải nghiệm
            mới mẻ.

        </p>


        <!-- BẤM VÀO ĐÂY → TRANG CHÍNH -->

        <a href="main.html" class="explore">
            Khám phá VANNIAN
        </a>


        <div class="location">
            📍 An Châu, An Giang
        </div>

    </main>

</body>

</html>
